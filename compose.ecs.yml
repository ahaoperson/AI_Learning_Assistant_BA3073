services:
  backend:
    restart: unless-stopped
    image: ${ACR_IMAGE:?Set ACR_IMAGE to your full ACR image and tag}
    ports:
      - "${AILA_BIND_IP:-127.0.0.1}:14242:14242"
    environment:
      APP_SQLITE_PATH: /app/data/app.sqlite
      WORKSPACE_ROOT: /app/workspace
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai_compatible}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen3.6-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_KEY_ENCRYPTION_KEY: ${MODEL_KEY_ENCRYPTION_KEY:-}
      MODEL_KEY_ENCRYPTION_FILE: ${MODEL_KEY_ENCRYPTION_FILE:-/app/data/model-key-encryption.key}
      MODEL_SECRET_FILE: ${MODEL_SECRET_FILE:-/app/data/model-secrets.env}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-1000000}
      MODEL_SUPPORTS_STREAMING: ${MODEL_SUPPORTS_STREAMING:-true}
      AILA_MOCK_MODEL_PROVIDER: ${AILA_MOCK_MODEL_PROVIDER:-}
    volumes:
      - ${AILA_DATA_DIR:-./data}:/app/data
      - ${AILA_WORKSPACE_DIR:-./workspace}:/app/workspace
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14242/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
